[project]
name = "maestro"
version = "0.1.0"
description = "AI scoring of customer support chats against a quality checklist"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "openpyxl>=3.1",
    "pydantic>=2.9",
]

[project.scripts]
maestro = "maestro.cli:main"

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maestro"]

[tool.pytest.ini_options]
testpaths = ["tests"]
